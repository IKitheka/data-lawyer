services:
  - type: web
    name: data-lawyer-api
    env: python
    plan: free # change later
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend.app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DL_API_KEY_FREE
        sync: false
      - key: DL_API_KEY_PRO
        sync: false
      - key: DL_API_KEY_BUSINESS
        sync: false
      - key: DL_API_KEY_ADMIN
        sync: false
      - key: DL_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
