services:
  - type: web
    name: data-lawyer-api
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker backend.app.main:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    autoDeploy: true
